<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fe428e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fe428e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fe428e" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Cascadia Code', 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="900" height="220" rx="14" fill="#141321"/>
  <rect x="1" y="1" width="898" height="218" rx="13" fill="none" stroke="#2b2b40" stroke-width="1"/>

  <!-- Left: name + typing tagline -->
  <text x="40" y="80" class="mono" font-size="34" font-weight="bold" fill="#ffffff">Ali Badri</text>

  <clipPath id="typeClip">
    <rect x="40" y="93" width="0" height="30">
      <animate attributeName="width" values="0;460;460;0;0" keyTimes="0;0.35;0.85;0.95;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <text x="40" y="116" class="mono" font-size="20" fill="#a9fef7" clip-path="url(#typeClip)">OCR &amp; Document AI Engineer_</text>

  <text x="40" y="160" class="mono" font-size="14" fill="#8b8fa3">Turning scanned documents into structured data</text>

  <!-- Right: mini document-scan visualization -->
  <g transform="translate(600,30)">
    <rect x="0" y="0" width="230" height="160" rx="10" fill="#1c1b2e" stroke="#33324a" stroke-width="1.5"/>

    <rect x="20" y="24" width="150" height="10" rx="3" fill="#33324a"/>
    <rect x="20" y="48" width="190" height="10" rx="3" fill="#33324a"/>
    <rect x="20" y="72" width="120" height="10" rx="3" fill="#33324a"/>
    <rect x="20" y="96" width="170" height="10" rx="3" fill="#33324a"/>
    <rect x="20" y="120" width="140" height="10" rx="3" fill="#33324a"/>

    <rect x="16" y="19" width="158" height="20" rx="4" fill="none" stroke="#fe428e" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.06;0.08;0.14;0.22;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="43" width="198" height="20" rx="4" fill="none" stroke="#fe428e" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.14;0.20;0.28;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="67" width="128" height="20" rx="4" fill="none" stroke="#fe428e" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.20;0.26;0.34;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="91" width="178" height="20" rx="4" fill="none" stroke="#fe428e" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.33;0.41;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="115" width="148" height="20" rx="4" fill="none" stroke="#fe428e" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.33;0.39;0.47;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="230" height="16" fill="url(#scanGrad)">
      <animate attributeName="y" values="0;0;150;150;0" keyTimes="0;0.02;0.40;0.42;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
