<svg xmlns="http://www.w3.org/2000/svg" width="600" height="590" viewBox="0 0 600 590" fill="none" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="sk-title sk-desc">
  <title id="sk-title">Skills at a glance</title>
  <desc id="sk-desc">Six skill areas: document AI and OCR, vision-language models, speech recognition, Persian and Arabic script, data and annotation, and ML engineering.</desc>
  <defs>
    <style>
      .blob-a { animation: drift-a 11s ease-in-out infinite alternate; }
      .blob-b { animation: drift-b 13s ease-in-out infinite alternate; }
      @keyframes drift-a { to { transform: translate(50px, 14px); } }
      @keyframes drift-b { to { transform: translate(-44px, -12px); } }
      @media (prefers-reduced-motion: reduce) { .blob-a, .blob-b { animation: none; } }
    </style>
    <linearGradient id="sk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="sk-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="sk-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="600" height="590" rx="16" fill="url(#sk-bg)"/>
  <rect x="0.5" y="0.5" width="599" height="589" rx="15.5" stroke="#ffffff" stroke-opacity="0.08"/>

  <g filter="url(#sk-soft)" opacity="0.5">
    <circle class="blob-a" cx="110" cy="70" r="90" fill="#7c5cff"/>
    <circle class="blob-b" cx="500" cy="530" r="100" fill="#22d3ee"/>
  </g>

  <text x="20" y="40" font-size="22" font-weight="700" fill="#eaf1ff">Skills at a glance</text>
  <text x="20" y="64" font-size="13.5" fill="#8fa0c8">OCR · document AI · Persian &amp; Arabic script</text>

  <!-- Row 1 -->
  <g transform="translate(20 86)">
    <rect width="270" height="148" rx="16" fill="url(#sk-glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="26" r="5" fill="#7c5cff"/>
    <text x="38" y="32" font-size="16.5" font-weight="700" fill="#eaf1ff">Document AI &amp; OCR</text>
    <text x="22" y="62" font-size="14" fill="#b9c6e6"><tspan fill="#7c5cff">›</tspan> Text detection &amp; segmentation</text>
    <text x="22" y="84" font-size="14" fill="#b9c6e6"><tspan fill="#7c5cff">›</tspan> Page orientation</text>
    <text x="22" y="106" font-size="14" fill="#b9c6e6"><tspan fill="#7c5cff">›</tspan> Text recognition</text>
    <text x="22" y="128" font-size="14" fill="#b9c6e6"><tspan fill="#7c5cff">›</tspan> Document classification</text>
  </g>
  <g transform="translate(310 86)">
    <rect width="270" height="148" rx="16" fill="url(#sk-glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="26" r="5" fill="#5b8cff"/>
    <text x="38" y="32" font-size="16.5" font-weight="700" fill="#eaf1ff">Vision-language models</text>
    <text x="22" y="62" font-size="14" fill="#b9c6e6"><tspan fill="#5b8cff">›</tspan> Fine-tuning (LoRA)</text>
    <text x="22" y="84" font-size="14" fill="#b9c6e6"><tspan fill="#5b8cff">›</tspan> Inference &amp; serving</text>
    <text x="22" y="106" font-size="14" fill="#b9c6e6"><tspan fill="#5b8cff">›</tspan> Benchmarking &amp; evaluation</text>
  </g>
  <g transform="translate(20 252)">
    <rect width="270" height="148" rx="16" fill="url(#sk-glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="26" r="5" fill="#22d3ee"/>
    <text x="38" y="32" font-size="16.5" font-weight="700" fill="#eaf1ff">Speech recognition</text>
    <text x="22" y="62" font-size="14" fill="#b9c6e6"><tspan fill="#22d3ee">›</tspan> Persian ASR fine-tuning</text>
    <text x="22" y="84" font-size="14" fill="#b9c6e6"><tspan fill="#22d3ee">›</tspan> WER / CER evaluation</text>
    <text x="22" y="106" font-size="14" fill="#b9c6e6"><tspan fill="#22d3ee">›</tspan> Text normalization</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(310 252)">
    <rect width="270" height="148" rx="16" fill="url(#sk-glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="26" r="5" fill="#f472b6"/>
    <text x="38" y="32" font-size="16.5" font-weight="700" fill="#eaf1ff">Persian &amp; Arabic script</text>
    <text x="22" y="62" font-size="14" fill="#b9c6e6"><tspan fill="#f472b6">›</tspan> Text normalization</text>
    <text x="22" y="84" font-size="14" fill="#b9c6e6"><tspan fill="#f472b6">›</tspan> Right-to-left &amp; bidi text</text>
    <text x="22" y="106" font-size="14" fill="#b9c6e6"><tspan fill="#f472b6">›</tspan> Fonts &amp; glyph coverage</text>
    <text x="22" y="128" font-size="14" fill="#b9c6e6"><tspan fill="#f472b6">›</tspan> Persian-aware metrics</text>
  </g>
  <g transform="translate(20 418)">
    <rect width="270" height="148" rx="16" fill="url(#sk-glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="26" r="5" fill="#2dd4bf"/>
    <text x="38" y="32" font-size="16.5" font-weight="700" fill="#eaf1ff">Data &amp; annotation</text>
    <text x="22" y="62" font-size="14" fill="#b9c6e6"><tspan fill="#2dd4bf">›</tspan> Synthetic data generation</text>
    <text x="22" y="84" font-size="14" fill="#b9c6e6"><tspan fill="#2dd4bf">›</tspan> Labeling &amp; review tools</text>
    <text x="22" y="106" font-size="14" fill="#b9c6e6"><tspan fill="#2dd4bf">›</tspan> Dataset versioning</text>
    <text x="22" y="128" font-size="14" fill="#b9c6e6"><tspan fill="#2dd4bf">›</tspan> Data quality checks</text>
  </g>
  <g transform="translate(310 418)">
    <rect width="270" height="148" rx="16" fill="url(#sk-glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="26" r="5" fill="#a78bfa"/>
    <text x="38" y="32" font-size="16.5" font-weight="700" fill="#eaf1ff">ML engineering</text>
    <text x="22" y="62" font-size="14" fill="#b9c6e6"><tspan fill="#a78bfa">›</tspan> Experiment tracking</text>
    <text x="22" y="84" font-size="14" fill="#b9c6e6"><tspan fill="#a78bfa">›</tspan> APIs &amp; web apps</text>
    <text x="22" y="106" font-size="14" fill="#b9c6e6"><tspan fill="#a78bfa">›</tspan> Docker &amp; Linux</text>
    <text x="22" y="128" font-size="14" fill="#b9c6e6"><tspan fill="#a78bfa">›</tspan> Python &amp; TypeScript</text>
  </g>
</svg>
